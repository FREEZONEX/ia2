<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Standalone operator panel — served by ia2-runtime's `--static-dir`
      at /hmi on the edge box itself. Deliberately a separate vite entry:
      an operator tablet loads screens + live values and nothing of the
      IDE bundle (editors, router, agent chrome).
    -->
    <title>IA2 HMI</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#ffffff" />
    <style>html,body{margin:0;background:#fff;color:#050b14}html.dark,html.dark body{background:#151a19;color:#f9f9f9}</style>
    <script>try{if(localStorage.getItem('ia2.theme')==='dark')document.documentElement.classList.add('dark')}catch{}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/hmi-main.tsx"></script>
  </body>
</html>
