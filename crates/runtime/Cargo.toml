[package]
name = "ia2-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ia2-runtime"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
tokio-stream.workspace = true
axum.workspace = true
ia2-http-guard = { path = "../http-guard" }
tower-http.workspace = true
# Locks that do not poison: see the comment on `parking_lot` in the workspace
# Cargo.toml. A panic under one of these frees it instead of failing every
# later request and the snapshot task with it.
parking_lot.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Reused IDE-side crates — the whole point of this binary is that it's a
# thin CLI wrapper around the bridge + project loader. No HTTP/LSP/CORS
# from the IDE-side `server` crate; nothing that wouldn't run on a
# headless edge box.
# Northbound MQTT publisher (edge -> supOS/Tier0). Pure-Rust async
# client; the event loop owns reconnection.
rumqttc = "0.24"

ironplc-bridge = { path = "../ironplc-bridge" }
project = { path = "../project" }

[dev-dependencies]
rumqttd = "0.20.0"
tempfile = "3"
tower.workspace = true
